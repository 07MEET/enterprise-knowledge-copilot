version: '3.8'

services:
  # 1. Local Ollama Service
  ollama:
    image: ollama/ollama:latest
    container_name: ekc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    restart: unless-stopped

  # 2. Automated Model Puller Sidecar
  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: ekc-model-puller
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      echo 'Waiting for Ollama service to start...'
      until curl -s http://ollama:11434/api/tags > /dev/null; do
        sleep 2
      done
      echo 'Ollama service is up! Pulling Llama 3.2 model...'
      curl -d '{\"name\": \"llama3.2\"}' http://ollama:11434/api/pull
      echo 'Llama 3.2 model pulled successfully!'
      "

  # 3. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
      - ollama-model-puller
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 4. Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    environment:
      - BACKEND_URL=http://backend:8000
    command: streamlit run streamlit_app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
