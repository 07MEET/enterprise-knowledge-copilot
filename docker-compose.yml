version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    environment:
      - BACKEND_URL=http://backend:8000
    command: streamlit run streamlit_app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
