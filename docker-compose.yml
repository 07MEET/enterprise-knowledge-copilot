version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekc-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
